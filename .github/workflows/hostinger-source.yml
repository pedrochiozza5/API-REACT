name: Validate and package V10 source

on:
  push:
    branches:
      - v10-source
  workflow_dispatch:

jobs:
  verify-and-package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run unit tests
        run: npm test

      - name: Typecheck frontend
        run: npm run typecheck:web

      - name: Verify Hostinger build compatibility
        run: npm run build

      - name: Install Chromium for browser smoke tests
        run: npx playwright install --with-deps chromium

      - name: Browser QA — Home, carousel, mobile product
        run: npm run test:e2e

      - name: Upload visual QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bienamargos-v10-VISUAL-QA
          path: |
            test-results/*.png
            test-results/**/*.zip
          if-no-files-found: warn

      - name: Prepare clean source at ZIP root
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p hostinger-source
          rsync -a ./ hostinger-source/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'node_modules/' \
            --exclude 'dist/' \
            --exclude 'dist-server/' \
            --exclude 'test-results/' \
            --exclude 'playwright-report/' \
            --exclude 'hostinger-source/' \
            --include '.env.example' \
            --exclude '.env' \
            --exclude '.env.*'
          test -f hostinger-source/package.json
          test -f hostinger-source/server.js
          test -d hostinger-source/src
          test -d hostinger-source/server
          node -e "const p=require('./hostinger-source/package.json');if(p.version!=='10.0.0')process.exit(1)"

      - name: Upload source ZIP for Hostinger
        uses: actions/upload-artifact@v4
        with:
          name: bienamargos-v10-HOSTINGER-SOURCE
          path: hostinger-source/**
          if-no-files-found: error
          compression-level: 6

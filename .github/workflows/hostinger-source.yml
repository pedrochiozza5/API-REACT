name: Hostinger source package

on:
  push:
    branches:
      - v9.2-source
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Prepare Hostinger source root
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p hostinger-source
          rsync -a ./ hostinger-source/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'node_modules/' \
            --exclude 'dist/' \
            --exclude 'dist-server/' \
            --exclude 'hostinger-source/'
          test -f hostinger-source/package.json
          test -f hostinger-source/server.js
          test -d hostinger-source/src
          test -d hostinger-source/server

      - name: Upload Hostinger-ready ZIP
        uses: actions/upload-artifact@v4
        with:
          name: bienamargos-v9.2-HOSTINGER-SOURCE
          path: hostinger-source/**
          if-no-files-found: error
          compression-level: 6
